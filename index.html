<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수학 실험실</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f5576c 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 30px;
            padding: 60px 80px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            font-size: 3em;
            color: #333;
            margin-bottom: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 50px;
            font-weight: 400;
        }
        
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .level-button {
            display: block;
            padding: 25px 40px;
            font-size: 1.5em;
            font-weight: 600;
            text-decoration: none;
            border-radius: 15px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .level-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.5s ease;
        }
        
        .level-button:hover::before {
            left: 100%;
        }
        
        .middle-school {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        
        .middle-school:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4);
        }
        
        .high-school {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
        }
        
        .high-school:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(245, 87, 108, 0.4);
        }
        
        .icon {
            margin-right: 10px;
            font-size: 1.2em;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 40px 30px;
            }
            
            h1 {
                font-size: 2.2em;
            }
            
            .subtitle {
                font-size: 1em;
            }
            
            .level-button {
                padding: 20px 30px;
                font-size: 1.3em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>수학 실험실</h1>
        <p class="subtitle">탐구하고 체험하는 수학의 세계</p>
        
        <div class="button-container">
            <a href="중등/" class="level-button middle-school">
                <span class="icon">📐</span>
                중학교 수학 실험
            </a>
            
            <a href="고등/" class="level-button high-school">
                <span class="icon">📊</span>
                고등학교 수학 실험
            </a>
        </div>
    </div>
</body>
</html>
